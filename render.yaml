services:
  - type: web
    name: johnweb
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && node scripts/seed.js
    startCommand: npm start
    healthCheckPath: /api/stats
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: 10000
